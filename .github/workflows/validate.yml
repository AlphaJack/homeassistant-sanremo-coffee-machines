name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch breakage from new Home Assistant releases rather than waiting for a
    # user to report it.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tracks the latest Home Assistant validation rules on purpose
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # HACS cannot install from a private repository, and its validation wants a
    # description and topics on the repo itself. Skip until the repo is public.
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tracks the latest HACS validation rules on purpose
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        # Python version from requires-python, ruff version from uv.lock
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check custom_components tests
      - run: uv run ruff format --check custom_components tests

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # the weekly run upgrades past uv.lock to test against the newest Home Assistant
      - name: Install dependencies
        run: uv sync ${{ github.event_name == 'schedule' && '--upgrade' || '--locked' }}
      - run: uv run pytest tests --cov=custom_components.sanremo --cov-report=term-missing
