name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch breakage from new Home Assistant releases rather than waiting for a
    # user to report it.
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  # Tracks what Home Assistant itself requires, currently >= 3.14.2.
  PYTHON_VERSION: "3.14"
  # Pinned so a new ruff release cannot fail CI on rules that did not exist when
  # the code was written.
  RUFF_VERSION: "0.16.3"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # HACS cannot install from a private repository, and its validation wants a
    # description and topics on the repo itself. Skip until the repo is public.
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==${{ env.RUFF_VERSION }}
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest tests --cov=custom_components.sanremo --cov-report=term-missing
